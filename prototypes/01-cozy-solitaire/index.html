<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>01-cozy-solitaire</title>
    <link rel="icon" href="data:," />
    <style>
      /* Every colour and size here comes from config/theme.json via
         @proto/ui's theme loader. Nothing visual is hard-coded. */
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f4e4cd;
      }
      #app {
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font: var(--font);
        display: grid;
        justify-items: center;
        align-content: start;
        gap: calc(var(--gap) * 1px);
        padding: calc(var(--gap) * 2px) calc(var(--gap) * 1px) 64px;
      }

      .board {
        background: var(--table);
        border-radius: calc(var(--radius) * 2px);
        padding: calc(var(--gap) * 1.5px);
        display: grid;
        gap: calc(var(--gap) * 1.5px);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);
      }
      .row {
        display: flex;
        gap: calc(var(--gap) * 1px);
        align-items: flex-start;
      }
      .spacer {
        width: calc(var(--cardWidth) * 1px);
      }

      .pile {
        width: calc(var(--cardWidth) * 1px);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .pile.tableau {
        min-height: calc(var(--cardHeight) * 1px);
      }

      .slot {
        width: calc(var(--cardWidth) * 1px);
        height: calc(var(--cardHeight) * 1px);
        border-radius: calc(var(--radius) * 1px);
        background: var(--slot);
        box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.06);
        display: grid;
        place-items: center;
        color: var(--inkSoft);
        font-size: 20px;
        cursor: pointer;
      }

      .card {
        position: relative;
        width: calc(var(--cardWidth) * 1px);
        height: calc(var(--cardHeight) * 1px);
        border-radius: calc(var(--radius) * 1px);
        background: var(--cardFace);
        box-shadow:
          0 1px 2px rgba(75, 58, 44, 0.28),
          inset 0 0 0 1px rgba(75, 58, 44, 0.1);
        cursor: pointer;
        user-select: none;
        flex: none;
      }
      /* Fanning: each card after the first slides up over the one below. */
      .pile .card + .card,
      .pile .card + .slot {
        margin-top: calc((var(--fanUp) - var(--cardHeight)) * 1px);
      }
      .pile .card.down + .card {
        margin-top: calc((var(--fanDown) - var(--cardHeight)) * 1px);
      }
      .pile.stacked .card + .card {
        margin-top: calc(var(--cardHeight) * -1px);
      }

      .card.down {
        background: repeating-linear-gradient(
          45deg,
          var(--cardBack),
          var(--cardBack) 6px,
          var(--cardBackTrim) 6px,
          var(--cardBackTrim) 12px
        );
        box-shadow:
          0 1px 2px rgba(75, 58, 44, 0.28),
          inset 0 0 0 2px var(--cardFace);
      }

      .card .rank {
        position: absolute;
        top: 4px;
        left: 6px;
        font-size: 15px;
        font-weight: 700;
        line-height: 1;
        color: var(--suit);
        display: flex;
        align-items: baseline;
        gap: 2px;
      }
      .card .rank i {
        font-style: normal;
        font-size: 13px;
        font-weight: 400;
      }
      .card .pip {
        position: absolute;
        right: 6px;
        bottom: 4px;
        font-size: 20px;
        line-height: 1;
        color: var(--suit);
      }
      .card.warm {
        --suit: var(--suitWarm);
      }
      .card.cool {
        --suit: var(--suitCool);
      }

      .card.sel {
        box-shadow:
          0 4px 10px rgba(75, 58, 44, 0.35),
          inset 0 0 0 3px var(--accent);
      }
      .ok {
        box-shadow:
          0 1px 2px rgba(75, 58, 44, 0.28),
          inset 0 0 0 3px var(--highlight);
      }

      .bar {
        display: flex;
        gap: calc(var(--gap) * 1px);
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 720px;
      }
      .bar button {
        font: inherit;
        font-size: 14px;
        border: 0;
        border-radius: calc(var(--radius) * 1px);
        padding: 7px 14px;
        background: var(--accent);
        color: var(--panel);
        cursor: pointer;
      }
      .bar button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .status {
        color: var(--ink);
        font-size: 15px;
      }
      .hint {
        color: var(--inkSoft);
        font-size: 13px;
        text-align: center;
        max-width: 560px;
      }
      .done {
        background: var(--panel);
        border-radius: calc(var(--radius) * 1px);
        padding: 10px 18px;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
