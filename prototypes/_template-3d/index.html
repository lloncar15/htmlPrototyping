<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>_template-3d</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e1014;
        overflow: hidden;
      }
      #app {
        position: relative;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: var(--font);
      }
      /* The canvas fills the page; the HUD floats over it. Everything
         else a designer sees (stamp, panel, note box) is @proto/ui. */
      #stage {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        text-align: center;
        pointer-events: none;
        user-select: none;
        background: rgba(12, 14, 18, 0.55);
        border-radius: calc(var(--radius) * 1px);
        padding: 8px 16px;
      }
      .status {
        font-variant-numeric: tabular-nums;
      }
      .meta {
        opacity: 0.5;
        font-size: 12px;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <div id="hud"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
